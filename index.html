<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Airline Cost Index Lookup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #131417; --muted: #70747c; --border: #eaeaec;
    --head-bg: #fafafa; --row-hover: #f5f6f8; --accent: #2f5fe0;
    --general-bg: #eef2ff; --general-fg: #2f4bb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0d10; --fg: #eceef0; --muted: #8b8f98; --border: #202226;
      --head-bg: #131418; --row-hover: #17181c; --accent: #7fa2ff;
      --general-bg: #1a2033; --general-fg: #9db3ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0; background: var(--bg); color: var(--fg);
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 1.5rem 1rem;
  }
  h1 { font-size: 1.15rem; font-weight: 650; letter-spacing: -.01em; margin: 0 0 .8rem; }
  .search-row { display: flex; gap: .6rem; max-width: 720px; }
  input[type="search"] {
    flex: 1; padding: .6rem .8rem; font-size: .95rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--fg);
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #count { color: var(--muted); font-size: .82rem; white-space: nowrap; align-self: center; }
  main { max-width: 720px; margin: 0 auto; padding: 0 1.5rem 3rem; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 72px; background: var(--head-bg);
    text-align: left; font-size: .68rem; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted);
    padding: .5rem .6rem; border-bottom: 1px solid var(--border);
  }
  tbody tr:hover { background: var(--row-hover); }
  td { padding: .5rem .6rem; font-size: .9rem; border-bottom: 1px solid var(--border); }
  td.airline { font-weight: 500; }
  td.ci { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .tag {
    display: inline-block; font-size: .68rem; font-weight: 650; letter-spacing: .03em;
    text-transform: uppercase; padding: .12rem .4rem; border-radius: 5px;
    background: var(--general-bg); color: var(--general-fg); margin-left: .4rem;
  }
  #empty { color: var(--muted); font-size: .9rem; padding: 2rem 0; text-align: center; display: none; }
</style>
</head>
<body>
<header>
  <h1>Airline Cost Index Lookup</h1>
  <div class="search-row">
    <input type="search" id="search" placeholder="Filter by airline or aircraft…" autocomplete="off">
    <span id="count"></span>
  </div>
</header>
<main>
  <div id="empty">No matches.</div>
  <table>
    <thead><tr><th>Airline</th><th>Aircraft</th><th>CI</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
</main>

<script>
async function main() {
  const res = await fetch('data/cost_indexes.csv');
  const text = await res.text();
  const rows = text.trim().split('\n').slice(1).map(line => {
    const c = line.split(',');
    return { airline: c[0], code: c[1], aircraft: c[2], cost_index: c[3] };
  });
  rows.sort((a, b) => a.airline.localeCompare(b.airline) || a.aircraft.localeCompare(b.aircraft));

  const search = document.getElementById('search');
  const tbody = document.getElementById('results');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  function render(filter) {
    const q = filter.trim().toLowerCase();
    const matches = q
      ? rows.filter(r => r.airline.toLowerCase().includes(q) || r.aircraft.toLowerCase().includes(q))
      : rows;

    tbody.innerHTML = '';
    let lastAirline = null;
    matches.forEach(r => {
      const tr = document.createElement('tr');

      const airline = document.createElement('td');
      airline.className = 'airline';
      if (r.airline !== lastAirline) {
        airline.textContent = r.airline;
        lastAirline = r.airline;
      }

      const aircraft = document.createElement('td');
      aircraft.textContent = r.aircraft === 'General' ? '' : r.aircraft;
      if (r.aircraft === 'General') {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'General';
        aircraft.appendChild(tag);
      }

      const ci = document.createElement('td');
      ci.className = 'ci';
      ci.textContent = r.cost_index;

      tr.append(airline, aircraft, ci);
      tbody.appendChild(tr);
    });

    empty.style.display = matches.length ? 'none' : 'block';
    const airlineCount = new Set(matches.map(r => r.airline)).size;
    count.textContent = q ? `${matches.length} rows, ${airlineCount} airlines` : `${rows.length} rows, ${airlineCount} airlines`;
  }

  search.addEventListener('input', () => render(search.value));
  render('');
}
main();
</script>
</body>
</html>
