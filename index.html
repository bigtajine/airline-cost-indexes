<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Airline Cost Index Lookup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; --border: #ddd; --head-bg: #f3f3f3; --link: #06c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e8e8e8; --muted: #9a9a9a; --border: #333; --head-bg: #22252a; --link: #6cf; }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2.5rem auto; padding: 0 1rem; color: var(--fg); background: var(--bg); }
  h1 { font-size: 1.5rem; margin-bottom: .3rem; }
  #meta { color: var(--muted); font-size: .88rem; margin-bottom: 1.2rem; }
  select { width: 100%; padding: .65rem; font-size: 1rem; margin-bottom: 1.2rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--border); font-size: .92rem; }
  th { background: var(--head-bg); font-weight: 600; }
  tbody tr:hover { background: var(--head-bg); }
  #empty { color: var(--muted); font-size: .9rem; padding: .5rem 0; display: none; }
  a { color: var(--link); }
</style>
</head>
<body>
<h1>Airline Cost Index Lookup</h1>
<div id="meta">Pick an airline, get its Cost Index values per aircraft. Source: <a href="data/cost_indexes.csv">cost_indexes.csv</a></div>
<select id="airline"><option value="">Select an airline…</option></select>
<div id="empty">No data for this airline.</div>
<table id="results"><thead><tr><th>Aircraft</th><th>CI</th><th>Notes</th><th>Source</th></tr></thead><tbody></tbody></table>

<script>
async function main() {
  const res = await fetch('data/cost_indexes.csv');
  const text = await res.text();
  const rows = text.trim().split('\n').slice(1).map(line => {
    const c = line.split(',');
    return { airline: c[0], code: c[1], aircraft: c[2], cost_index: c[3], notes: c[4], source: c[5] };
  });

  const airlines = [...new Set(rows.map(r => r.airline))].sort();
  const select = document.getElementById('airline');
  for (const a of airlines) {
    const opt = document.createElement('option');
    opt.value = a;
    opt.textContent = a;
    select.appendChild(opt);
  }

  const tbody = document.querySelector('#results tbody');
  const empty = document.getElementById('empty');
  select.addEventListener('change', () => {
    tbody.innerHTML = '';
    const matches = rows.filter(r => r.airline === select.value);
    empty.style.display = select.value && !matches.length ? 'block' : 'none';
    matches.forEach(r => {
      const tr = document.createElement('tr');
      for (const val of [r.aircraft, r.cost_index, r.notes || '', r.source]) {
        const td = document.createElement('td');
        td.textContent = val;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    });
  });
}
main();
</script>
</body>
</html>
