<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Airline Cost Index Lookup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #767676; --border: #e5e5e5; --row-hover: #f7f7f7; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131417; --fg: #ececec; --muted: #8a8a8a; --border: #2a2b30; --row-hover: #1c1d21; --accent: #6ea8fe; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 640px; margin: 4rem auto; padding: 0 1.25rem;
    color: var(--fg); background: var(--bg);
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 1.5rem; }
  select {
    width: 100%; padding: .75rem .9rem; font-size: 1rem; margin-bottom: 1.5rem;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--fg); appearance: none;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); padding: 0 .5rem .5rem;
  }
  td { padding: .6rem .5rem; border-top: 1px solid var(--border); font-size: .95rem; }
  tbody tr:hover { background: var(--row-hover); }
  td.ci { font-variant-numeric: tabular-nums; font-weight: 600; }
  #empty { color: var(--muted); font-size: .9rem; padding: .5rem; display: none; }
</style>
</head>
<body>
<h1>Airline Cost Index Lookup</h1>
<select id="airline"><option value="">Select an airline…</option></select>
<div id="empty">No data for this airline.</div>
<table id="results"><thead><tr><th>Aircraft</th><th>CI</th></tr></thead><tbody></tbody></table>

<script>
async function main() {
  const res = await fetch('data/cost_indexes.csv');
  const text = await res.text();
  const rows = text.trim().split('\n').slice(1).map(line => {
    const c = line.split(',');
    return { airline: c[0], code: c[1], aircraft: c[2], cost_index: c[3] };
  });

  const airlines = [...new Set(rows.map(r => r.airline))].sort();
  const select = document.getElementById('airline');
  for (const a of airlines) {
    const opt = document.createElement('option');
    opt.value = a;
    opt.textContent = a;
    select.appendChild(opt);
  }

  const tbody = document.querySelector('#results tbody');
  const empty = document.getElementById('empty');
  select.addEventListener('change', () => {
    tbody.innerHTML = '';
    const matches = rows.filter(r => r.airline === select.value);
    empty.style.display = select.value && !matches.length ? 'block' : 'none';
    matches.forEach(r => {
      const tr = document.createElement('tr');
      const aircraft = document.createElement('td');
      aircraft.textContent = r.aircraft;
      const ci = document.createElement('td');
      ci.className = 'ci';
      ci.textContent = r.cost_index;
      tr.append(aircraft, ci);
      tbody.appendChild(tr);
    });
  });
}
main();
</script>
</body>
</html>
